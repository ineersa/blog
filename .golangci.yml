# Auto-generated .golangci.yml file.
# See https://gowebly.org for more information.

version: "2"

# Linters settings.
linters-settings:
  tagalign:
    order:
      - json
      - db
      - validate
    strict: true

  funlen:
    lines: 120
    ignore-comments: true

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

  gocyclo:
    min-complexity: 15

  mnd:
    checks:
      - argument
      - case
      - condition
      - return
    ignored-functions:
      - byte

  gosec:
    exclude-generated: true
    excludes:
      - G101
      - G202

  errorlint:
    asserts: false

  lll:
    line-length: 300

  misspell:
    locale: US

  nolintlint:
    allow-unused: false # report any unused nolint directives
    require-explanation: false # don't require an explanation for nolint directives
    require-specific: false # don't require nolint directives to be specific about.templ which linter is being skipped

  revive:
    rules:
      - name: unexported-return
        disabled: true
      - name: unused-parameter

  copyloopvar:
    check-alias: true

# Linters to enable.
linters:
  disable-all: true

  enable:
    - copyloopvar
    - dogsled
    - dupl
    - errcheck
    - errorlint
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - mnd
    - goprintffuncname
    - govet
    - ineffassign
    - misspell
    - nakedret
    - nolintlint
    - nilerr
    - nilnil
    - staticcheck
    - unconvert
    - unparam
    - unused

# Issues configuration.
issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - mnd
    - linters:
        - gosec
      text: "G202:"
  exclude-files:
    - '.*_templ\\.go$'

# Run configuration.
run:
  timeout: 5m
  tests: false

